<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login | YACUBA ONLINE STORE</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .login-note{margin:12px 0;padding:10px 12px;border-radius:10px;background:#f4f6f2;color:#5e6a61;font-size:12px;display:none}
    .login-error{margin:12px 0;padding:12px;border-radius:10px;background:#fdecec;color:#a33434;font-size:13px;white-space:pre-wrap;display:none}
    .login-success{margin:12px 0;padding:12px;border-radius:10px;background:#eaf6ed;color:#27613a;font-size:13px;display:none}
    .login-debug{margin-top:14px;font-size:11px;color:#7a847d;line-height:1.5}
  </style>
</head>
<body class="admin-body">
  <main style="min-height:100vh;display:grid;place-items:center;padding:20px">
    <section class="checkout-card" style="width:min(430px,100%)">
      <div class="kicker">YACUBA ONLINE STORE</div>
      <h1>Admin Login</h1>
      <p class="muted">Manage products, categories, orders, reviews, feedback and offers.</p>

      <div id="moduleError" class="login-error"></div>
      <div id="loginError" class="login-error"></div>
      <div id="loginSuccess" class="login-success"></div>
      <div id="loginNote" class="login-note">Checking your Supabase connection…</div>

      <form id="loginForm" class="form-grid" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="loginBtn" class="btn btn-primary" type="submit">Sign In</button>
      </form>

      <div class="login-debug">Admin email: abucayjenny5@gmail.com</div>
      <p><a href="../index.html" class="muted">← Back to website</a></p>
    </section>
  </main>

  <script type="module">
    const note = document.getElementById('loginNote');
    const errorBox = document.getElementById('loginError');
    const moduleError = document.getElementById('moduleError');
    const successBox = document.getElementById('loginSuccess');
    const form = document.getElementById('loginForm');
    const button = document.getElementById('loginBtn');

    function showError(message, target = errorBox) {
      target.textContent = message || 'Something went wrong.';
      target.style.display = 'block';
    }

    function hideMessages() {
      [errorBox, moduleError, successBox].forEach(el => {
        el.textContent = '';
        el.style.display = 'none';
      });
    }

    // Use explicit imports here so a config/module problem is shown clearly instead of
    // silently falling back to a normal browser form submit.
    let supabase;
    try {
      const mod = await import('../assets/js/supabase.js');
      supabase = mod.supabase;
      note.style.display = 'block';
      note.textContent = 'Supabase connection loaded. Ready to sign in.';
    } catch (err) {
      showError('Admin login could not load its JavaScript/Supabase configuration.\n\n' + (err?.message || err), moduleError);
      note.style.display = 'block';
      note.textContent = 'Fix assets/js/config.js, then redeploy Cloudflare.';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideMessages();

      if (!supabase) {
        showError('Supabase was not loaded. Check assets/js/config.js and make sure the file contains a valid Project URL and Publishable key.', moduleError);
        return;
      }

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Enter both email and password.');
        return;
      }

      button.disabled = true;
      button.textContent = 'Signing in…';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw new Error(error.message);
        if (!data?.user) throw new Error('Supabase did not return a user session.');

        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('id,email,role')
          .eq('id', data.user.id)
          .maybeSingle();

        if (profileError) throw new Error('Could not read admin profile: ' + profileError.message);
        if (!profile || profile.role !== 'admin') {
          await supabase.auth.signOut();
          throw new Error('Login succeeded, but this account is not marked as admin.');
        }

        successBox.textContent = 'Login successful. Opening Admin Dashboard…';
        successBox.style.display = 'block';
        window.location.replace('index.html');
      } catch (err) {
        showError(err?.message || String(err));
        button.disabled = false;
        button.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
