<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="../assets/css/style.css"></head><body class="admin-body"><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><section class="checkout-card" style="width:min(430px,100%)"><div class="kicker">YACUBA ONLINE STORE</div><h1>Admin Login</h1><p class="muted">Manage products, categories, orders, reviews, feedback and offers.</p><form id="loginForm" class="form-grid"><div class="form-field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="form-field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary">Sign In</button></form><p id="loginError" style="color:var(--red);font-size:13px"></p><a href="../index.html" class="muted">← Back to website</a></section></main><script type="module">import {supabase} from '../assets/js/supabase.js';const f=document.getElementById('loginForm'),m=document.getElementById('loginError');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='';const {error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){m.textContent=error.message;return}const {data:{user}}=await supabase.auth.getUser();const {data:p}=await supabase.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role!=='admin'){await supabase.auth.signOut();m.textContent='This account is not an admin.';return}location.href='index.html';});</script></body></html>
