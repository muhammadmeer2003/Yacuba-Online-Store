<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2726%27 fill=%27%231d4b35%27/%3E%3Ctext x=%2750%27 y=%2772%27 font-size=%2765%27 font-weight=%27900%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27%3EY%3C/text%3E%3C/svg%3E"><meta name="theme-color" content="#1d4b35"><meta name="robots" content="noindex"><link rel="stylesheet" href="../assets/css/style.css"></head><body class="admin-body"><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><section class="checkout-card" style="width:min(430px,100%)"><div class="kicker">YACUBA ONLINE STORE</div><h1>Admin Login</h1><p class="muted">Manage products, categories, orders, reviews, feedback and offers.</p><form id="loginForm" class="form-grid"><div class="form-field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="form-field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary">Sign In</button></form><p id="loginError" style="color:var(--red);font-size:13px"></p><a href="../index.html" class="muted">← Back to website</a></section></main><script type="module">import {supabase} from '../assets/js/supabase.js';(async()=>{const {data:{session}}=await supabase.auth.getSession();if(session){const {data:p}=await supabase.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(p?.role==='admin')location.href='index.html';}})();const f=document.getElementById('loginForm'),m=document.getElementById('loginError');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='';const {error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){m.textContent=error.message;return}const {data:{user}}=await supabase.auth.getUser();const {data:p}=await supabase.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role!=='admin'){await supabase.auth.signOut();m.textContent='This account is not an admin.';return}location.href='index.html';});</script></body></html>
