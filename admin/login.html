<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YACUBA ONLINE STORE — Admin Login</title>
  <style>
    :root{--green:#183b2b;--green2:#2f684c;--cream:#f6f4ee;--white:#fff;--border:#dfe5df;--text:#1e2a23;--muted:#6c776f;--red:#b33d3d;--gold:#cda44a}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef3ec,#f8f6f0);color:var(--text);display:grid;place-items:center;padding:22px}
    .wrap{width:min(940px,100%);display:grid;grid-template-columns:1.05fr .95fr;background:var(--white);border-radius:28px;overflow:hidden;box-shadow:0 25px 70px rgba(24,59,43,.13);border:1px solid var(--border)}
    .brand{background:linear-gradient(145deg,var(--green),#285740);color:#fff;padding:44px;display:flex;flex-direction:column;justify-content:center;min-height:560px}
    .brand .mark{width:66px;height:66px;border-radius:20px;background:rgba(255,255,255,.13);display:grid;place-items:center;font-weight:900;font-size:26px;margin-bottom:26px}
    .eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:800;color:#dfeadd}.brand h1{font-size:46px;line-height:1.05;margin:12px 0}.brand p{color:#d7e4dc;max-width:410px;line-height:1.7}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.chip{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);padding:8px 11px;border-radius:999px;font-size:12px}
    .panel{padding:44px}.panel h2{margin:0 0 7px;font-size:30px}.panel .sub{margin:0 0 24px;color:var(--muted);font-size:14px}.status{padding:11px 13px;border-radius:11px;font-size:13px;margin-bottom:16px;background:#eef6ef;color:var(--green2);border:1px solid #d8e9da}.status.error{background:#fff0f0;color:var(--red);border-color:#f0d0d0}.status.info{background:#f8f4e7;color:#7b6128;border-color:#eadfb9}.hidden{display:none!important}
    form{display:grid;gap:13px} label{font-size:13px;font-weight:750} input{width:100%;border:1px solid var(--border);border-radius:12px;padding:14px 15px;font-size:15px;outline:none;background:#fff}input:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(47,104,76,.08)}
    button{border:0;border-radius:12px;background:var(--green);color:#fff;padding:14px 16px;font-weight:800;font-size:15px;cursor:pointer;margin-top:5px}button:hover{background:#214e39}button:disabled{opacity:.65;cursor:not-allowed}.back{display:inline-block;margin-top:18px;color:var(--green2);font-size:13px;font-weight:700}
    .debug{margin-top:18px;padding:11px 12px;border:1px dashed var(--border);border-radius:11px;font-size:12px;color:var(--muted);line-height:1.6}.ok{color:var(--green2);font-weight:700}.bad{color:var(--red);font-weight:700}
    @media(max-width:760px){.wrap{grid-template-columns:1fr}.brand{min-height:auto;padding:30px}.brand h1{font-size:36px}.panel{padding:30px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="brand">
      <div class="mark">YO</div>
      <div class="eyebrow">YACUBA ONLINE STORE</div>
      <h1>Admin Panel</h1>
      <p>Manage products, categories, orders, reviews, feedback and store content from one secure dashboard.</p>
      <div class="chips"><span class="chip">Products</span><span class="chip">Orders</span><span class="chip">Reviews</span><span class="chip">Feedback</span></div>
    </section>

    <section class="panel">
      <h2>Sign in</h2>
      <p class="sub">Use your Supabase admin account.</p>
      <div id="status" class="status info">Connecting to the login service…</div>

      <form id="loginForm" novalidate>
        <div><label for="email">Email</label><input id="email" type="email" value="Admin2026@gmail.com" autocomplete="username" placeholder="admin@example.com" required></div>
        <div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>
        <button id="loginBtn" type="submit">Sign In</button>
      </form>

      <a class="back" href="../index.html">← Back to website</a>
      <div class="debug" id="debug">Checking connection…</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://wrdsxcdabpzwbfgcbbol.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_DHiQO1JXCUYLgRTk4VnBJQ_ZzKTMkPA";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const button = document.getElementById('loginBtn');
    const status = document.getElementById('status');
    const debug = document.getElementById('debug');

    function show(message, type='info') {
      status.textContent = message;
      status.className = 'status ' + type;
    }

    function setDebug(html){ debug.innerHTML = html; }

    (async function boot(){
      try {
        const { data, error } = await sb.auth.getSession();
        if (error) throw error;
        if (data.session?.user) {
          show('Existing session found. Checking admin access…', 'info');
          const { data: profile, error: profileError } = await sb.from('profiles').select('role,email').eq('id', data.session.user.id).single();
          if (!profileError && profile?.role === 'admin') {
            setDebug('<span class="ok">Connected • Admin session found</span>');
            location.href = './index.html';
            return;
          }
        }
        show('Ready. Enter your admin email and password.', 'info');
        setDebug('<span class="ok">Supabase connection loaded</span>');
      } catch (e) {
        show('Login service could not start: ' + (e?.message || e), 'error');
        setDebug('<span class="bad">Supabase connection failed</span><br>Check that this page is being opened from the deployed website, not as a local file.');
      }
    })();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      event.stopPropagation();

      const userEmail = email.value.trim();
      const userPassword = password.value;
      if (!userEmail || !userPassword) {
        show('Please enter both email and password.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Signing in…';
      show('Signing in…', 'info');

      try {
        const { data, error } = await sb.auth.signInWithPassword({ email: userEmail, password: userPassword });
        if (error) throw error;
        if (!data.user) throw new Error('Supabase did not return a user session.');

        const { data: profile, error: profileError } = await sb
          .from('profiles')
          .select('id,email,role')
          .eq('id', data.user.id)
          .single();

        if (profileError) throw new Error('Login succeeded, but the admin profile could not be read: ' + profileError.message);
        if (profile?.role !== 'admin') {
          await sb.auth.signOut();
          throw new Error('This account is logged in but its profile role is not admin.');
        }

        setDebug('<span class="ok">Login successful • Admin verified</span>');
        show('Login successful. Opening Admin Dashboard…', 'info');
        setTimeout(() => { location.href = './index.html'; }, 250);
      } catch (e) {
        console.error(e);
        show(e?.message || 'Login failed.', 'error');
        setDebug('<span class="bad">Login failed</span><br>If the message says “Invalid login credentials”, reset the password in Supabase Authentication → Users.');
      } finally {
        button.disabled = false;
        button.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
