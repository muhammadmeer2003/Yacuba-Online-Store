<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-auth-body">
    <div class="login-card">
        <h2>System Controller</h2>
        <div id="alertBox" class="alert error" style="display:none;"></div>
        <form id="loginForm">
            <div class="input-group"><label>Email</label><input type="email" id="email" required></div>
            <div class="input-group"><label>Password</label><input type="password" id="password" required></div>
            <button type="submit" class="btn login-btn">Login</button>
        </form>
    </div>
    <script src="../assets/js/config.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });
            if (error) { document.getElementById('alertBox').style.display = 'block'; document.getElementById('alertBox').textContent = error.message; }
            else { window.location.href = "index.html"; }
        });
    </script>
</body>
</html>
