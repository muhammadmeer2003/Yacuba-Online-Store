<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Dashboard | YACUBA ONLINE STORE</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-shell">
  <header class="admin-top">
    <div class="container admin-top-inner">
      <div>
        <strong>YACUBA ONLINE STORE — Admin</strong>
        <div style="font-size:12px;opacity:.8">Manage categories and products</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span id="adminEmail" style="font-size:12px;opacity:.85"></span>
        <a class="small-btn" href="../index.html">Website</a>
        <button id="logoutBtn" class="small-btn">Logout</button>
      </div>
    </div>
  </header>

  <main class="container admin-grid">
    <section class="admin-panel">
      <h2 id="categoryFormTitle">Add Category</h2>
      <form id="categoryForm" class="admin-form">
        <label for="categoryName">Category Name</label>
        <input id="categoryName" placeholder="e.g. Baked Items" required>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Save Category</button>
          <button class="small-btn" id="cancelCategoryEdit" type="button" hidden>Cancel</button>
        </div>
      </form>
      <div style="margin-top:20px"><h3>Categories</h3><div id="categoriesList" class="admin-list"></div></div>
    </section>

    <section class="admin-panel">
      <h2 id="productFormTitle">Add Product</h2>
      <form id="productForm" class="admin-form">
        <input id="productId" type="hidden">
        <label for="productName">Product Name</label>
        <input id="productName" placeholder="e.g. Chicken Nuggets" required>
        <label for="productCategory">Category</label>
        <select id="productCategory"></select>
        <label for="productPrice">Price</label>
        <input id="productPrice" type="number" min="0" step="0.01" placeholder="350" required>
        <label for="productSalePrice">Offer Price (optional)</label>
        <input id="productSalePrice" type="number" min="0" step="0.01" placeholder="299">
        <label for="productDescription">Description</label>
        <textarea id="productDescription" placeholder="Short product description"></textarea>
        <label for="productImage">Product Image</label>
        <input id="productImage" type="file" accept="image/*">
        <label class="check-row"><input id="productAvailable" type="checkbox" checked> Available / In Stock</label>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Save Product</button>
          <button class="small-btn" id="cancelProductEdit" type="button" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="admin-panel full">
      <h2>Products</h2>
      <div id="productsList" class="admin-list"></div>
    </section>
  </main>

  <script type="module" src="../assets/js/admin.js"></script>
</body>
</html>
