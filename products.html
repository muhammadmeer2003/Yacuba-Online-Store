<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Showcase | YACUBA Store</title>
    <script src="https://jsdelivr.net"></script>
    <link href="https://cloudflare.com" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">YACUBA<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html" class="active">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>
    <section class="products-showcase">
        <div class="search-filter-wrapper">
            <div class="search-box"><input type="text" id="searchInput" placeholder="Search products..."></div>
            <div class="filter-container">
                <select id="categoryFilter"><option value="all">All Categories</option></select>
            </div>
        </div>
        <div class="products-grid" id="allProductsContainer"></div>
    </section>
    <script src="assets/js/config.js"></script>
    <script>
        let localProducts = [];
        document.addEventListener('DOMContentLoaded', async () => {
            const searchInput = document.getElementById('searchInput');
            const categoryFilter = document.getElementById('categoryFilter');
            try {
                const { data: categories } = await _supabase.from('categories').select('*').order('name');
                if (categories) { categories.forEach(cat => { categoryFilter.innerHTML += `<option value="${cat.id}">${cat.name}</option>`; }); }
                const { data: products } = await _supabase.from('products').select('*, categories(name)').order('name');
                localProducts = products || [];
                renderProducts();
            } catch (err) { console.error(err); }
            searchInput.addEventListener('input', renderProducts);
            categoryFilter.addEventListener('change', renderProducts);
        });
        function renderProducts() {
            const searchVal = searchInput.value.toLowerCase();
            const catVal = categoryFilter.value;
            const container = document.getElementById('allProductsContainer');
            const filtered = localProducts.filter(p => p.name.toLowerCase().includes(searchVal) && (catVal === 'all' || p.category_id === catVal));
            if(filtered.length === 0) { container.innerHTML = '<p class="no-data">No items match.</p>'; return; }
            container.innerHTML = filtered.map(prod => `
                <div class="product-card">
                    <div class="img-container"><img src="${prod.image_url || 'https://placeholder.com'}" alt="${prod.name}"></div>
                    <div class="product-info"><span class="cat-tag">${prod.categories?.name || 'General'}</span><h3>${prod.name}</h3><p class="desc">${prod.description || ''}</p><div class="price-row">PHP ${prod.sale_price ? `\${prod.sale_price} <del class="old-price">\${prod.price}</del>` : prod.price}</div></div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
